<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>react-native-waveform-player</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D946EF" />
      <stop offset="1" stop-color="#DB2777" />
    </linearGradient>
  </defs>
  <!-- voice-note bubble -->
  <rect x="3" y="12" width="58" height="40" rx="20" fill="url(#g)" />
  <!-- play button -->
  <path d="M13 25.2v13.6c0 1.1 1.2 1.8 2.2 1.2l10.4-6.8c.9-.6.9-1.8 0-2.4L15.2 24c-1-.6-2.2.1-2.2 1.2z" fill="#fff" />
  <!-- waveform: played bars solid, the rest translucent -->
  <rect x="30" y="27" width="3.5" height="10" rx="1.75" fill="#fff" />
  <rect x="36" y="21" width="3.5" height="22" rx="1.75" fill="#fff" />
  <rect x="42" y="25" width="3.5" height="14" rx="1.75" fill="#fff" fill-opacity="0.5" />
  <rect x="48" y="22" width="3.5" height="20" rx="1.75" fill="#fff" fill-opacity="0.5" />
  <rect x="54" y="28.5" width="3" height="7" rx="1.5" fill="#fff" fill-opacity="0.5" />
</svg>
